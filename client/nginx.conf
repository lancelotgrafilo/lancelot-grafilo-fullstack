server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text-based assets for faster loads
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache hashed build assets aggressively; Vite renames files on every change
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Every other route falls through to index.html so React Router can handle it
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers, mirroring what helmet() already does on the API
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
}